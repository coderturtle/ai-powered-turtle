project: ai-powered-turtle
project_type: factory-output
id_prefix: APT
run_description: "A published article, prompt kit, blog post, tool guide, or documentation page in the AI-powered Turtle knowledge lab"
task_types:
  - research-post
  - prompt-kit
  - blog-post
  - tool-guide
  - documentation
fields:
  run_id:        "run-YYYYMMDD-APT-NNN"
  project:       "ai-powered-turtle"
  task_id:       "APT-NNN"
  task_type:     "see task_types above"
  engine:        "who/what did the work"
  status:        "done | pending-response | in-progress | failed | abandoned"
  created:       "ISO 8601 date"
  human_confirmed: "false until human reviews"
  human_notes:   "optional review notes"
  output_artifact: "path to output file"
  failure_reason:  "populated when status is failed"
